<!DOCTYPE html>
<html>
<head>
  <title>User Register</title>
   <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navbar (RIGHT) -->
  <div style="text-align:right; padding:10px;">
    <a href="index.html">Home</a> |
    <a href="about.html">About</a> |
    <a href="help.html">Help</a> |
    <a href="user-login.html">User Login</a> |
    <a href="admin-login.html">Admin Login</a>
  </div>

  <hr>

  <!-- Center Content -->
  <div style="width:40%; margin:auto; text-align:center; padding:40px;">

    <h1>User Register</h1>
    <p>Register to create your account</p>

    <div id="msg"></div>

    <div style="text-align:left; margin-top:20px;">
      <label>Name</label><br>
      <input id="name" type="text" placeholder="Enter your name" style="width:100%; padding:6px;"><br><br>

      <label>Email</label><br>
      <input id="email" type="email" placeholder="Enter your email" style="width:100%; padding:6px;"><br><br>

      <label>Password</label><br>
      <input id="password" type="password" placeholder="Create password" style="width:100%; padding:6px;"><br><br>
    </div>

    <button id="regBtn">Register</button>

    <p style="margin-top:15px;">
      Already have an account?
      <a href="user-login.html">Go to Login</a>
    </p>

  </div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/user/register.js"></script>

</body>
</html>
