<!DOCTYPE html>
<html>
<head>
  <title>Admin - View Results</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navbar (RIGHT) -->
  <div style="text-align:right; padding:10px;">
    <a href="index.html">Home</a> |
    <a href="admin-dashboard.html">Dashboard</a> |
    <a href="admin-add-question.html">Add Question</a> |
    <a href="admin-view-questions.html">View Questions</a>
  </div>

  <hr>

  <!-- Center ONLY heading + actions -->
  <div style="width:80%; margin:auto; padding:30px;">

    <div style="text-align:center;">
      <h1>All User Results</h1>

      <p>
        This page loads from:
        <b>/admin/results/all</b>
      </p>

      <div style="margin:15px 0;">
        <button id="refreshBtn" type="button">Refresh</button>
        <button id="backBtn" type="button" style="margin-left:15px;">Back</button>
      </div>

      <div id="msg"></div>
    </div>

    <!-- Table stays NORMAL -->
    <div style="overflow:auto; margin-top:20px;">
      <table id="rTable" style="width:100%; border-collapse:collapse;">
        <thead>
          <tr>
            <th style="padding:10px; border-bottom:1px solid #ccc;">ID</th>
            <th style="padding:10px; border-bottom:1px solid #ccc;">User Email</th>
            <th style="padding:10px; border-bottom:1px solid #ccc;">Score</th>
            <th style="padding:10px; border-bottom:1px solid #ccc;">Total</th>
            <th style="padding:10px; border-bottom:1px solid #ccc;">%</th>
            <th style="padding:10px; border-bottom:1px solid #ccc;">Status</th>
            <th style="padding:10px; border-bottom:1px solid #ccc;">Grade</th>
            <th style="padding:10px; border-bottom:1px solid #ccc;">Submitted At</th>
          </tr>
        </thead>
        <tbody id="rBody">
          <!-- rows added by JS -->
        </tbody>
      </table>
    </div>

  </div>

  <!-- Scripts (NO CHANGE) -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin/view-results.js"></script>

</body>
</html>
